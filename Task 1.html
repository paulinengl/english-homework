<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#faf8f6"/><title>B1–B1+ · Vocabulary Lab</title><style>
:root{--ink:#29343b;--muted:#728087;--line:#e5e5e3;--bg:#faf8f6;--white:#fff;--lav:#7d7db3;--lavlight:#ededf9;--mint:#d8e8dc;--good:#297957;--bad:#aa5253;--peach:#f6e6de}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.shell{max-width:760px;margin:0 auto;padding:32px 18px 74px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.logo{font-weight:800;letter-spacing:-.05em;font-size:24px}.logo span{color:var(--lav)}.topmeta{font-size:12px;color:var(--muted);text-align:right}.card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 10px 38px #5549390b}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--lav);font-weight:750}.title{font-size:clamp(26px,5vw,40px);line-height:1.15;letter-spacing:-.04em;margin:8px 0 14px}.sub{color:var(--muted);margin:0 0 23px}.fieldlabel{font-size:13px;font-weight:700;display:block;margin:18px 0 8px}input.text,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;outline:0;color:var(--ink)}input.text:focus,textarea:focus{border-color:var(--lav);box-shadow:0 0 0 4px var(--lavlight)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;background:var(--lav);color:white;padding:12px 18px;font-weight:700;min-height:45px}.btn.alt{background:#f0eff4;color:var(--ink)}.btn.outline{border:1px solid var(--line);color:var(--ink);background:white}.btn.full{width:100%}.facts{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.pill{background:var(--lavlight);border-radius:999px;padding:7px 12px;color:#56558e;font-size:12px;font-weight:700}.muted{color:var(--muted)}.small{font-size:13px}.progress{height:9px;border-radius:999px;overflow:hidden;background:#efeee9;margin:12px 0 26px}.fill{height:100%;width:0%;background:#9291c7;transition:width .25s}.question{font-size:clamp(19px,3.8vw,25px);line-height:1.45;white-space:pre-line;letter-spacing:-.02em;font-weight:720;margin:14px 0 20px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:white;border:1.5px solid #e3e2e4;color:var(--ink);border-radius:13px;padding:14px 15px;margin:9px 0;min-height:53px}.opt:hover:not(:disabled){border-color:#a4a3d5;background:#fbfaff}.opt.chosen{border-color:var(--lav);background:#f4f3fe}.opt .letter{font-weight:800;color:#77749f;min-width:20px}.feedback{border-radius:15px;background:#f2f6f1;padding:17px;margin-top:22px;border:1px solid #dfecdf}.feedback.wrong{background:#fdf5f1;border-color:#f4dfd5}.feedback h3{margin:0 0 7px;font-size:17px}.feedback p{margin:7px 0 0;font-size:14px}.answer{font-weight:800;white-space:pre-line}.qmeta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted)}.divider{border:0;border-top:1px solid var(--line);margin:24px 0}.listenbox{background:#f2f1fa;border-radius:16px;padding:16px;margin-bottom:20px}.listenbox p{font-size:13px;margin:0 0 10px;color:#56588c}.matchrow{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;align-items:center;margin-bottom:12px}.matchrow>span{font-weight:650;font-size:14px}select{width:100%;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#f7f7f8;border-radius:15px;padding:16px 8px;text-align:center}.stat strong{display:block;font-size:clamp(21px,4vw,31px);letter-spacing:-.04em}.stat span{font-size:11px;color:var(--muted)}.bigscore{text-align:center;font-size:66px;color:var(--good);font-weight:850;letter-spacing:-.06em;margin:2px 0}.barlabel{display:flex;justify-content:space-between;font-size:13px;margin-top:14px}.roundbar{height:7px;border-radius:10px;background:#f0efef;overflow:hidden;margin-top:6px}.roundbar>div{background:#84a999;height:100%}.reviewrow{padding:15px 0;border-bottom:1px solid var(--line)}.reviewrow strong{display:block;font-size:14px}.reviewrow p{font-size:12px;color:var(--muted);margin:4px 0}.hide{display:none!important}.notice{font-size:13px;padding:13px;border-radius:12px;background:#faf0e6;color:#83593e}.nameTag{padding:10px 14px;border-radius:12px;background:#f4f2fa;color:#656195;font-size:13px;margin-top:12px;display:inline-block}.checkbox{display:inline-flex;gap:8px;align-items:center}.skip{font-size:12px;color:var(--muted)}@media(max-width:500px){.shell{padding:18px 12px 44px}.card{padding:21px 17px;border-radius:18px}.stats{gap:6px}.stat{padding:13px 4px}.matchrow{grid-template-columns:1fr;gap:4px}.actions .btn{flex:1}}
</style></head><body><div class="shell"><header><div class="logo">vocab<span>lab.</span></div><div class="topmeta">B1–B1+ · Vocabulary Practice<br/>2 rounds · 100 questions</div></header><main id="app"></main></div><script>
const Q=[{"type": "choice", "q": "She felt dizzy, then suddenly ______ in the crowded train.", "opts": ["stretched", "fainted", "choked", "convulsed"], "a": 1, "exp": "Faint = briefly lose consciousness. «Lose my consciousness» is possible but «lose consciousness» is the natural expression.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "He started ______ on a piece of bread, so someone helped him.", "answers": ["choking"], "exp": "Choke on something = be unable to breathe properly because something blocks the throat.", "tag": "Gap fill"}, {"type": "choice", "q": "After three hours of meetings, I could barely think clearly. I had terrible ______.", "opts": ["brain fog", "convulsions", "a sick leave", "a miracle"], "a": 0, "exp": "Brain fog = difficulty concentrating or thinking clearly.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "The doctor said the patient was having ______, so we called for help immediately.", "answers": ["convulsions"], "exp": "Convulsions = sudden, involuntary muscle movements; this is a medical symptom.", "tag": "Gap fill"}, {"type": "choice", "q": "My doctor told me to take time off work while I recover. I’m ______.", "opts": ["on sick leave", "at sick leave", "in a sick leave", "by sick leave"], "a": 0, "exp": "Be on sick leave is the correct collocation; leave is usually uncountable here.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "Who normally provides medical care and monitors patients in a hospital?", "opts": ["A thief", "A nurse", "A stretcher", "An orphan"], "a": 1, "exp": "A nurse provides care to patients. A stretcher is equipment for carrying an injured person.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "The paramedics carried her into the ambulance on a ______.", "answers": ["stretcher"], "exp": "The noun is stretcher (носилки), not stretches, which are stretching exercises or extensions.", "tag": "Gap fill"}, {"type": "gap", "q": "I know the name of that actor, but it’s on the tip of my ______.", "answers": ["tongue"], "exp": "On the tip of my tongue = almost remembered, but not quite accessible.", "tag": "Gap fill"}, {"type": "choice", "q": "The doctors thought he might not survive, but he recovered. It felt like ______.", "opts": ["a miracle", "a happy medium", "a double-edged sword", "a drop in the bucket"], "a": 0, "exp": "A miracle = an extraordinary, seemingly impossible positive event.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "We want to travel more without spending all our savings. We need to find a happy ______.", "answers": ["medium"], "exp": "Find a happy medium = find a compromise between two extremes; more natural here than golden mean.", "tag": "Gap fill"}, {"type": "choice", "q": "The character looked completely ______, with no expression or energy.", "opts": ["liveless", "lively", "alive", "lifeless"], "a": 3, "exp": "Lifeless is the correct adjective; liveless is not standard English.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Many of these problems ______ from a lack of communication.", "answers": ["stem"], "exp": "Stem from = originate from or be caused by. Subject «problems» takes stem.", "tag": "Gap fill"}, {"type": "choice", "q": "She has been working late and waking up at 5 a.m. for weeks. She is ______.", "opts": ["burning the candle at both ends", "holding her ground", "on sick leave", "turning a blind eye"], "a": 0, "exp": "Burn the candle at both ends = exhaust yourself by doing too much with too little rest.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct the sentence: “My parents don’t allow me go out late.”", "answers": ["My parents don’t allow me to go out late.", "My parents do not allow me to go out late."], "exp": "Allow someone to do something needs the to-infinitive.", "tag": "Fix the mistake"}, {"type": "choice", "q": "The manager knows people ignore safety rules but deliberately does nothing. He ______.", "opts": ["turns a blind eye to it", "stands his ground", "bears it in mind", "comes to terms with it"], "a": 0, "exp": "Turn a blind eye to = deliberately ignore something you know is happening.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "I’m staying in bed, watching films and relaxing all day. I’m having ______.", "opts": ["a scorcher", "a shower", "a sick leave", "a duvet day"], "a": 3, "exp": "A duvet day = an informal day spent relaxing in bed or at home.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "At a shop, which is the most natural polite offer?", "opts": ["Could you be helped me?", "Could I helping you?", "Could I help you?", "Could I to help you?"], "a": 2, "exp": "Could I help you? is a polite offer. Can I help you? is also very natural.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "“I ______ go to the cinema this weekend, but I haven’t decided.”", "opts": ["can’t", "might", "will definitely", "must"], "a": 1, "exp": "Might or could can express possibility about future plans.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "When the price becomes higher, it ______.", "opts": ["rises", "is raising", "raises", "grows up"], "a": 0, "exp": "Prices rise (intransitive); companies raise prices (transitive).", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Please ______ your hand if you know the answer.", "answers": ["raise"], "exp": "Raise something = lift it; rise has no direct object.", "tag": "Gap fill"}, {"type": "choice", "q": "We spent the whole afternoon outside in 35°C heat. It was ______.", "opts": ["damp", "below zero", "scorching hot", "chilly"], "a": 2, "exp": "Scorching hot = extremely hot, typically under intense sun.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "It started pouring, and we got absolutely ______ on our way home.", "answers": ["soaked"], "exp": "Get soaked = become completely wet, usually from rain.", "tag": "Gap fill"}, {"type": "match", "q": "Match each weather word to the most precise description.", "pairs": [["chilly", "uncomfortably cold"], ["balmy", "pleasantly warm"], ["humid", "hot or warm with moisture in the air"], ["damp", "slightly wet, often unpleasantly"]], "exp": "Chilly and balmy describe temperature; humid describes moisture in the air; damp usually describes wet conditions or surfaces.", "tag": "Matching", "choices": ["pleasantly warm", "uncomfortably cold", "hot or warm with moisture in the air", "slightly wet, often unpleasantly"]}, {"type": "choice", "q": "The forecast says it will be ______ tonight, with temperatures of −8°C.", "opts": ["mild", "balmy", "boiling", "below zero"], "a": 3, "exp": "Below zero = below 0°C; in everyday weather reports, «below freezing» can also be used.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "It’s neither hot nor cold, and winters here are usually quite ______.", "opts": ["scorching", "windy", "freezing", "mild"], "a": 3, "exp": "Mild weather is not extremely hot or cold.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "It isn’t raining heavily; it’s just ______.", "answers": ["drizzling"], "exp": "Drizzle = rain lightly in very small drops.", "tag": "Gap fill"}, {"type": "choice", "q": "There were several short periods of rain, with sunshine in between. The forecast mentioned ______.", "opts": ["showers", "settled weather", "a clear sky", "smog"], "a": 0, "exp": "Showers are brief periods of rain, unlike continuous heavy rain.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "There’s a gentle ______, so it doesn’t feel too hot.", "answers": ["breeze"], "exp": "A breeze is a light wind.", "tag": "Gap fill"}, {"type": "choice", "q": "The drivers could barely see the road because of ______ fog.", "opts": ["thick", "bright", "mild", "balmy"], "a": 0, "exp": "Thick fog or dense fog are strong collocations.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "The city air was polluted by traffic and smoke. A grey layer of ______ hung over it.", "opts": ["smog", "mist", "showers", "sunshine"], "a": 0, "exp": "Smog = polluted air, associated with smoke and other pollutants; mist/fog can occur without pollution.", "tag": "Meaning & nuance"}, {"type": "listen", "spoken": "The roads were icy, and visibility was poor because of dense fog.", "q": "Which TWO hazards does the speaker mention?", "opts": ["Icy roads and dense fog", "Showers and bright sunshine", "Heavy rain and strong winds", "Smog and hot weather"], "a": 0, "exp": "Icy roads have ice on them; dense fog seriously reduces visibility.", "tag": "Listening"}, {"type": "choice", "q": "“I was just checking the headlines, but I ______ scrolling through bad news for an hour.”", "opts": ["ended up", "turned up", "made up", "gave up"], "a": 0, "exp": "End up + -ing = finally do something, often unexpectedly.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Mindlessly reading a stream of negative news online is called ______.", "answers": ["doomscrolling", "doom scrolling"], "exp": "Doomscrolling is the usual spelling; doom scrolling is also seen.", "tag": "Gap fill"}, {"type": "choice", "q": "“This app helps me stay informed, but it also wastes hours of my time.” “It’s ______.”", "opts": ["a happy medium", "a drop in the bucket", "a double-edged sword", "a miracle"], "a": 2, "exp": "A double-edged sword has both advantages and disadvantages.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “From the one hand, recycling helps; from the other hand, it costs money.”", "answers": ["On the one hand, recycling helps; on the other hand, it costs money."], "exp": "The fixed pair is on the one hand … on the other hand, not from the one hand.", "tag": "Fix the mistake"}, {"type": "gap", "q": "People need to wake up to the ______ that plastic pollution is a serious problem.", "answers": ["fact"], "exp": "Wake up to the fact that ... = finally realise and accept an important truth.", "tag": "Gap fill"}, {"type": "choice", "q": "A cheap solution may help ______, but create problems later.", "opts": ["in advance", "in the short term", "at the tip of my tongue", "on sick leave"], "a": 1, "exp": "In the short term describes effects over a relatively brief period; contrast with in the long term.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Single-use packaging is a major ______ to plastic waste.", "answers": ["contributor"], "exp": "A major contributor to something = an important cause or source.", "tag": "Gap fill"}, {"type": "choice", "q": "“How much plastic is recycled?” “It ______ dramatically from country to country.”", "opts": ["raises", "stems", "rises", "varies"], "a": 3, "exp": "Vary dramatically = differ a great deal. It varies from country to country.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "The thought of more extreme floods is a worrying ______.", "answers": ["prospect"], "exp": "A worrying prospect = a possible future event or situation that causes concern.", "tag": "Gap fill"}, {"type": "choice", "q": "Which phrase means “a tiny amount compared with what is needed”?", "opts": ["a double-edged sword", "a happy medium", "a drop in the bucket", "the tip of my tongue"], "a": 2, "exp": "A drop in the bucket is especially common in AmE; BrE often uses a drop in the ocean.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “We have easy access to informations online.”", "answers": ["We have easy access to information online."], "exp": "Information is uncountable; easy access to something is correct (not an easy access).", "tag": "Fix the mistake"}, {"type": "gap", "q": "The lift isn’t working today. It’s out of ______.", "answers": ["order"], "exp": "Be out of order = not working, especially a machine or service.", "tag": "Gap fill"}, {"type": "choice", "q": "My old phone still works, but its software is no longer supported. It’s becoming ______.", "opts": ["obsolete", "fragile", "superior", "humid"], "a": 0, "exp": "Obsolete = no longer in general use or superseded by newer technology.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "______ in mind that the museum closes at six.", "answers": ["Bear", "Keep"], "exp": "Bear in mind = remember or take into account. Keep in mind is also natural.", "tag": "Gap fill"}, {"type": "choice", "q": "When her grandfather died, she struggled to ______ the loss.", "opts": ["come to terms with", "turn a blind eye to", "keep up with", "stand her ground at"], "a": 0, "exp": "Come to terms with = gradually accept an unpleasant reality.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "New technologies change so fast that I can barely ______ the latest updates.", "opts": ["keep up with", "stem from", "wake up to", "come to terms with"], "a": 0, "exp": "Keep up with = stay informed about, or at the same pace as, something that changes.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "My phone was at 3%, but luckily I had a ______ with me to see in the dark.", "answers": ["flashlight", "torch"], "exp": "Flashlight (AmE) / torch (BrE) is a portable electric light.", "tag": "Gap fill"}, {"type": "choice", "q": "Which is the most natural collocation?", "opts": ["a well-lit photo", "a well-light photo", "a well-litly photo", "a well-lightedness photo"], "a": 0, "exp": "Well-lit = having plenty of light, especially in a photograph or room.", "tag": "Meaning & nuance"}, {"type": "listen", "spoken": "I brought a lantern to the campsite, but I forgot my flashlight.", "q": "What did the speaker forget?", "opts": ["A flashlight", "A lantern", "A garland", "A corkscrew"], "a": 0, "exp": "A flashlight is a hand-held electric torch; a lantern is often freestanding or hangs up.", "tag": "Listening"}, {"type": "choice", "q": "Which sentence uses “lack” correctly?", "opts": ["A lack of sleep affects my concentration.", "I have a lack sleep.", "I lack of sleep every night.", "She lacks of vitamins."], "a": 0, "exp": "Noun: a lack of sleep. Verb: lack sleep / lack vitamins — without of.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "We’re planning to ______ a charity event next month.", "answers": ["host", "organise", "organize"], "exp": "Host or organise an event are natural collocations.", "tag": "Gap fill"}, {"type": "choice", "q": "The story ended with the broken furniture being thrown away. “It ______ in a bin.”", "opts": ["stemmed from", "ran into", "turned into", "ended up"], "a": 3, "exp": "End up in a bin describes the final destination; end up + -ing describes an eventual action.", "tag": "Meaning & nuance"}, {"type": "listen", "spoken": "According to the research, the amount of household waste can vary dramatically between regions.", "q": "What is the main message?", "opts": ["Waste is always the fault of households", "Waste levels may differ greatly by region", "Waste levels are identical everywhere", "Every region has stopped recycling"], "a": 1, "exp": "According to the research introduces a source; vary dramatically means differ significantly.", "tag": "Listening"}, {"type": "gap", "q": "The accident was ______; sadly, the driver didn’t survive.", "answers": ["fatal", "lethal"], "exp": "Fatal is particularly natural for an accident or injury. Lethal can describe something capable of causing death.", "tag": "Gap fill"}, {"type": "choice", "q": "She had painful muscle ______ after the marathon.", "opts": ["drawings", "miracles", "cramps", "convulsions"], "a": 2, "exp": "Cramps are painful, involuntary muscle contractions. Convulsions are stronger, often repeated muscle movements and can signal a serious medical issue.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "Which object would you use to open a wine bottle?", "opts": ["A garland", "A stretcher", "A corkscrew", "A lantern"], "a": 2, "exp": "A corkscrew removes a cork from a bottle.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "A technical ______ shows the dimensions of a building before construction.", "opts": ["cloth", "portrait", "flashlight", "drawing"], "a": 3, "exp": "A technical drawing is a diagram used in design or engineering.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "We decorated the balcony with fairy ______ for the holidays.", "answers": ["lights"], "exp": "Fairy lights or string lights are natural terms for decorative lights; garlands are decorative chains or wreath-like arrangements.", "tag": "Gap fill"}, {"type": "choice", "q": "Which sentence is the most natural?", "opts": ["This table is made by wood.", "This table makes of wood.", "This table is made of wood.", "This table is made from with wood."], "a": 2, "exp": "Be made of + visible/recognisable material is natural; made from emphasises transformation, e.g. paper made from wood.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Given the difficult ______, we decided to postpone the meeting.", "answers": ["circumstances"], "exp": "Under/in the circumstances and given the circumstances are established patterns.", "tag": "Gap fill"}, {"type": "choice", "q": "Be careful with that glass vase; it’s very ______.", "opts": ["superior", "humid", "obsolete", "fragile"], "a": 3, "exp": "Fragile = easily broken or damaged.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “She did it with good intensions.”", "answers": ["She did it with good intentions."], "exp": "Intention = purpose or aim. Spelling: good intentions, not intensions.", "tag": "Fix the mistake"}, {"type": "gap", "q": "You should book your tickets in ______ to avoid disappointment.", "answers": ["advance"], "exp": "In advance = before the time of an event or action.", "tag": "Gap fill"}, {"type": "choice", "q": "He often acts as though he is better than everyone else. He seems to feel ______.", "opts": ["inferior", "fragile", "superior", "lethal"], "a": 2, "exp": "Feel superior to someone = believe you are better than them; feel inferior to = believe you are less capable or valuable.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "The ______ was so high that the bathroom mirror stayed wet for hours.", "answers": ["humidity"], "exp": "Humidity (noun) / humid (adjective). High humidity is a natural collocation.", "tag": "Gap fill"}, {"type": "choice", "q": "Which is grammatically correct?", "opts": ["You should be wary about of online scams.", "You should be wary of online scams.", "You should wary of online scams.", "You should be wary from online scams."], "a": 1, "exp": "Be wary of = be cautious or suspicious about. Wary is an adjective, not a verb.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "He grew up in an ______ after losing both parents.", "answers": ["orphanage"], "exp": "An orphanage is an institution where children without parental care may live; an orphan is a child whose parents have died.", "tag": "Gap fill"}, {"type": "choice", "q": "Which collocation is correct?", "opts": ["skin prone for acne", "acne-proning skin", "acne-proned skin", "acne-prone skin"], "a": 3, "exp": "Prone to + noun: skin prone to acne. Before a noun use acne-prone skin.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “Pour the water in the glass.” (Use the verb + movement preposition that clearly describes entering.)", "answers": ["Pour the water into the glass."], "exp": "Pour into highlights movement from outside to inside. «Pour water in the glass» can be heard, but into is clearer.", "tag": "Fix the mistake"}, {"type": "choice", "q": "Which word refers to a piece of fabric used for cleaning?", "opts": ["clothes", "a cloth", "clothing", "a cloak"], "a": 1, "exp": "A cloth = piece of fabric, often for cleaning. Clothes = garments.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Even when they criticised her, she refused to give in and decided to stand her ______.", "answers": ["ground"], "exp": "Stand your ground = refuse to change your position under pressure.", "tag": "Gap fill"}, {"type": "choice", "q": "She didn’t want to buy the dress, but the influencer’s video ______ her decision.", "opts": ["rose", "stemmed", "swayed", "bore"], "a": 2, "exp": "Sway a decision or be swayed by someone = influence a choice.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "He enrolled in a course to ______ his communication skills.", "opts": ["pour", "raise", "enhance", "rise"], "a": 2, "exp": "Enhance your skills = improve their quality or effectiveness. Develop/improve are also natural.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "His job involves intense concentration and constant decisions; the cognitive ______ can be exhausting.", "answers": ["load"], "exp": "Cognitive load = the amount of mental effort used in processing information.", "tag": "Gap fill"}, {"type": "choice", "q": "There’s too much information to process at once. I’m experiencing ______.", "opts": ["settled weather", "a worrying prospect", "a happy medium", "cognitive overload"], "a": 3, "exp": "Cognitive overload = more information or demands than you can comfortably process.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "Which phrase is most natural?", "opts": ["gas emission of people", "an emitted gas of transport", "carbon emissions", "the gases emission"], "a": 2, "exp": "Carbon emissions / greenhouse gas emissions are common phrases when discussing pollution.", "tag": "Meaning & nuance"}, {"type": "listen", "spoken": "The charity is raising money to help children affected by hunger and malnutrition.", "q": "Which problem is the charity addressing?", "opts": ["Air pollution", "Unsafe roads", "Flood warnings", "Poor access to food and nutrients"], "a": 3, "exp": "Malnutrition means inadequate or unbalanced nutrition; hunger refers to the need for food.", "tag": "Listening"}, {"type": "choice", "q": "He forgot my name again. He says he has ______.", "opts": ["a mind out of order", "a memory like a corkscrew", "a memory like a sieve", "a brain like a lantern"], "a": 2, "exp": "Have a memory like a sieve = forget things easily. A memory like a goldfish is another informal option.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "She loves making clothes, so she has started learning to ______.", "answers": ["sew"], "exp": "Sew = make or repair things using a needle and thread; pronounced /səʊ/ (like so).", "tag": "Gap fill"}, {"type": "choice", "q": "After years of working in IT, she signed up for ______ to do something creative.", "opts": ["arts and crafts classes", "cognitive overload classes", "gas emission classes", "technical circumstances"], "a": 0, "exp": "Arts and crafts classes involve creative activities such as making or decorating objects.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “The thieves stealed my bike.”", "answers": ["The thieves stole my bike."], "exp": "Steal – stole – stolen is irregular; plural of thief is thieves.", "tag": "Fix the mistake"}, {"type": "choice", "q": "Which sentence is correct?", "opts": ["She swam at across the pool.", "She swam over the pool.", "She swam across the pool.", "She swam through across the pool."], "a": 2, "exp": "Swim across means go from one side to the other. Swim across the sea is possible but often implies a very long distance.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "He fell ______ his bike and hurt his knee.", "answers": ["off"], "exp": "Fall off a bike, tree or chair; fall down the stairs.", "tag": "Gap fill"}, {"type": "choice", "q": "Children love going on the ______ at the playground.", "opts": ["lights", "rides of sunset", "slides", "rises"], "a": 2, "exp": "Slides are playground equipment you slide down. Rides are attractions, e.g. at a fairground.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “She got married with a doctor last year.”", "answers": ["She got married to a doctor last year."], "exp": "Get married to someone, but marry someone (without to).", "tag": "Fix the mistake"}, {"type": "gap", "q": "After a long flight, we finally arrived ______ Canada.", "answers": ["in"], "exp": "Arrive in a city/country; arrive at a particular place/building. No preposition with arrive home.", "tag": "Gap fill"}, {"type": "gap", "q": "We arrived ______ the hotel just after midnight.", "answers": ["at"], "exp": "Arrive at the hotel, station or airport; arrive in London or Canada.", "tag": "Gap fill"}, {"type": "choice", "q": "Which sentence is correct?", "opts": ["She’s dedicated for help others.", "She’s dedicated to help others.", "She’s dedicated with helping others.", "She’s dedicated to helping others."], "a": 3, "exp": "Be dedicated to + noun/-ing; here to is a preposition, not part of an infinitive.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "The sunshine was lovely all morning, but by lunchtime the weather had completely changed. It’s so ______.", "opts": ["settled", "clear", "changeable", "mild"], "a": 2, "exp": "Changeable weather = weather that changes often or quickly.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "After weeks of storms, we finally had a few days of ______ weather.", "answers": ["settled"], "exp": "Settled weather = stable weather without major changes.", "tag": "Gap fill"}, {"type": "choice", "q": "It was difficult to see the mountains through the thin ______ early in the morning.", "opts": ["mist", "smog", "bright sunshine", "strong winds"], "a": 0, "exp": "Mist is a thinner veil of tiny water droplets than thick fog.", "tag": "Meaning & nuance"}, {"type": "choice", "q": "There was ______ rain throughout the night, and some streets flooded.", "opts": ["scorching", "strongly", "huge", "heavy"], "a": 3, "exp": "Heavy rain is the natural collocation; strong winds, not heavy winds.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "The temperature is comfortable, but it feels sticky because the air is very ______.", "answers": ["humid"], "exp": "Humid = containing a lot of moisture; the noun is humidity.", "tag": "Gap fill"}, {"type": "choice", "q": "The forecast says it’s going to be a real ______ tomorrow — around 38°C.", "opts": ["shower", "scorcher", "breeze", "mist"], "a": 1, "exp": "A scorcher = an extremely hot day (informal).", "tag": "Meaning & nuance"}, {"type": "listen", "spoken": "The forecast says bright sunshine in the morning, followed by showers and strong winds in the afternoon.", "q": "What is expected in the afternoon?", "opts": ["Bright sunshine only", "Showers and strong winds", "Icy roads and thick fog", "Freezing temperatures"], "a": 1, "exp": "Showers are short periods of rainfall; strong winds are powerful winds.", "tag": "Listening"}, {"type": "choice", "q": "I wanted to help, but my suggestion actually made things worse. At least I acted ______.", "opts": ["on best intentions", "in good intention", "with good intensions", "with good intentions"], "a": 3, "exp": "With good intentions means intending to help, even if the result is bad. You can also say with the best of intentions.", "tag": "Meaning & nuance"}, {"type": "gap", "q": "Correct: “She told me to bear on mind the deadline.”", "answers": ["She told me to bear in mind the deadline.", "She told me to bear the deadline in mind."], "exp": "Bear something in mind / bear in mind something both work. The preposition is in.", "tag": "Fix the mistake"}, {"type": "gap", "q": "When the summer ended, the colours of the flowers began to ______ away.", "answers": ["fade"], "exp": "Fade away = gradually disappear or become weaker. Can describe colours, feelings, memories or sounds.", "tag": "Gap fill"}, {"type": "match", "q": "Match the weather expressions with their meanings.", "pairs": [["freezing", "extremely cold"], ["boiling", "extremely hot"], ["windy", "with a lot of wind"], ["clear sky", "no clouds"]], "exp": "Freezing and boiling are colloquial extremes; windy and clear sky describe conditions.", "tag": "Matching", "choices": ["extremely hot", "no clouds", "with a lot of wind", "extremely cold"]}];
const KEY='vocab-lab-b1-trial-v3';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').toLowerCase().normalize('NFKC').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[.?!,;:“”"()]/g,'').replace(/\s+/g,' ').trim();
function fresh(){return {name:'',idx:0,results:{},draft:{},finished:false,started:0,elapsed:0,review:false,reviewList:[],reviewIndex:0,report:null}}
let st;try{st={...fresh(),...JSON.parse(localStorage.getItem(KEY))}}catch{st=fresh()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch{}}
function elapsed(){return (st.elapsed||0)+(st.started&& !st.finished?Math.floor((Date.now()-st.started)/1000):0)}
function formatTime(secs){let m=Math.floor(secs/60),s=secs%60;return m+' min '+String(s).padStart(2,'0')+' sec'}
function html(s){$('#app').innerHTML=s}
function start(){const name=$('#studentName').value.trim();if(!name){$('#nameError').classList.remove('hide');return}st.name=name;st.started=Date.now();st.elapsed=0;persist();render()}
function intro(){html(`<div class="card"><div class="eyebrow">Homework · Trial edition</div><h1 class="title">Your vocabulary<br/>in real English.</h1><p class="sub">Two rounds, 50 questions each. Practise meanings, grammar, collocations, gap fills, matching, and short listening activities.</p><div class="facts"><span class="pill">100 questions</span><span class="pill">Instant explanations</span><span class="pill">Final screenshot</span></div><label class="fieldlabel" for="studentName">Your name / Имя</label><input id="studentName" maxlength="48" class="text" placeholder="e.g. Anna" value="${esc(st.name)}"/><p id="nameError" class="hide small" style="color:var(--bad)">Please enter your name.</p><p class="small muted">Your progress is saved in this browser. You can take a break and return on the same device. Your teacher will only see the result you share.</p><div class="notice">Listening uses your device's English text-to-speech voice. If playback isn't supported, a text alternative is available.</div><div class="actions"><button class="btn full" onclick="start()">Start practice →</button></div></div>`);$('#studentName').onkeydown=e=>{if(e.key==='Enter')start()}}
function currentId(){return st.review?st.reviewList[st.reviewIndex]:st.idx}
function isAnswered(i){return st.review ? st.reviewDraft?.[i]?.marked : !!st.results[i]}
function response(i){return st.review ? (st.reviewDraft?.[i]?.response??'') : (st.draft[i]??'')}
function choose(i,v){if(isAnswered(i))return; if(st.review){st.reviewDraft??={};st.reviewDraft[i]={response:v};}else st.draft[i]=v;persist();drawOptions(i)}
function drawOptions(i){const q=Q[i],v=response(i);if(q.type==='choice'||q.type==='listen') document.querySelectorAll('[data-choice]').forEach(el=>el.classList.toggle('chosen',el.dataset.choice===String(v)));let b=$('#checkBtn');if(b)b.disabled=!hasResponse(i)}
function hasResponse(i){const q=Q[i],v=response(i);if(q.type==='match')return v&&typeof v==='object'&&q.pairs.every((p,j)=>v[j]!==undefined&&v[j]!=='');return String(v??'').trim()!==''}
function speaking(i){let q=Q[i];if(!('speechSynthesis' in window)){alert('Voice playback is not available in this browser. Use Show transcript.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.spoken);u.lang='en-GB';u.rate=.87;let vv=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('en'));if(vv)u.voice=vv;speechSynthesis.speak(u)}catch(e){alert('Audio unavailable. Use Show transcript.') }}
function transcript(i){let x=$('#transcript');x.textContent=Q[i].spoken;x.classList.remove('hide')}
function scoreAnswer(i,v){const q=Q[i];if(q.type==='choice'||q.type==='listen')return Number(v)===q.a;if(q.type==='gap')return q.answers.some(a=>clean(v)===clean(a));if(q.type==='match')return q.pairs.every((p,j)=>v&&v[j]===p[1]);return false}
function solution(q){if(q.type==='choice'||q.type==='listen')return q.opts[q.a];if(q.type==='gap')return q.answers.join(' / ');if(q.type==='match')return q.pairs.map(x=>x[0]+' → '+x[1]).join(' · ')}
function check(){let i=currentId(),v=response(i);if(!hasResponse(i))return;const good=scoreAnswer(i,v);if(st.review){st.reviewDraft??={};st.reviewDraft[i]={response:v,marked:true,good}}else{st.results[i]={v,good};delete st.draft[i]}persist();render()}
function setInput(v){let i=currentId();if(st.review){st.reviewDraft??={};st.reviewDraft[i]={response:v}}else st.draft[i]=v;persist();$('#checkBtn').disabled=!hasResponse(i)}
function setMatch(row,value){let i=currentId();let v=response(i);if(!v||typeof v!=='object'||Array.isArray(v))v={};v[row]=value;choose(i,v);$('#checkBtn').disabled=!hasResponse(i)}
function next(){if(st.review){if(st.reviewIndex<st.reviewList.length-1){st.reviewIndex++;persist();render()}else{st.review=false;persist();report()};return}if(st.idx===99){finish();return}st.idx++;persist();render()}
function previous(){if(st.review){if(st.reviewIndex>0){st.reviewIndex--;persist();render()}}else if(st.idx>0){st.idx--;persist();render()}}
function beginSecond(){st.idx=50;persist();render()}
function finish(){st.elapsed=elapsed();st.started=0;st.finished=true;st.review=false;st.report=makeReport();persist();report()}
function makeReport(){let good=Object.values(st.results).filter(x=>x.good).length;let per=[0,1].map(r=>{let a=Q.slice(r*50,r*50+50).filter((x,j)=>st.results[r*50+j]?.good).length;return a});return {good,bad:100-good,percent:good,seconds:st.elapsed,rounds:per,date:new Date().toLocaleDateString('en-GB'),name:st.name}}
function render(){if(!st.name||!st.started&&!st.finished&&!st.results[0]&&!st.review){intro();return}if(st.finished&&!st.review){report();return}let i=currentId(),q=Q[i],marked=isAnswered(i),v=response(i),correct=marked?scoreAnswer(i,v):false;let num=st.review?st.reviewIndex+1:i%50+1;let total=st.review?st.reviewList.length:50,round=st.review?'REVIEW MISTAKES':`ROUND ${Math.floor(i/50)+1} · ${Math.floor(i/50)===0?'RECOGNITION':'ACCURACY'}`;
let content='';if(q.type==='listen'){content+=`<div class="listenbox"><p>Listen to the short recording, then answer.</p><button class="btn alt" onclick="speaking(${i})">▶ Play audio</button> <button class="btn outline" onclick="transcript(${i})">Show transcript</button><p id="transcript" class="hide" style="margin-top:12px;color:var(--ink)"></p></div>`}
if(q.type==='choice'||q.type==='listen')content+=q.opts.map((a,j)=>`<button class="opt ${String(v)===String(j)?'chosen':''}" data-choice="${j}" ${marked?'disabled':''} onclick="choose(${i},'${j}')"><span class="letter">${'ABCD'[j]}.</span><span>${esc(a)}</span></button>`).join('');
if(q.type==='gap')content+=`<label class="fieldlabel">Type your answer (exact word, phrase or corrected sentence)</label><input class="text" autocomplete="off" id="textAnswer" ${marked?'disabled':''} placeholder="Your answer…" value="${esc(typeof v==='string'?v:'')}" oninput="setInput(this.value)"/>`;
if(q.type==='match')content+=q.pairs.map((p,j)=>`<div class="matchrow"><span>${esc(p[0])}</span><select ${marked?'disabled':''} onchange="setMatch(${j},this.value)"><option value="">Choose meaning…</option>${q.choices.map(c=>`<option value="${esc(c)}" ${v&&v[j]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('');
let fb=marked?`<div class="feedback ${correct?'':'wrong'}"><h3>${correct?'✓ Correct!':'↻ Not quite'}</h3><div class="answer">${esc(solution(q))}</div><p>${esc(q.exp)}</p></div>`:'';
let footer=marked?`<button class="btn" onclick="next()">${st.review?(st.reviewIndex===st.reviewList.length-1?'Back to results →':'Next mistake →'):(i===99?'Finish & see results →':i===49?'Complete Round 1 →':'Next question →')}</button>`:`<button class="btn" id="checkBtn" ${!hasResponse(i)?'disabled':''} onclick="check()">Check answer →</button>`;
html(`<div class="card"><div class="qmeta"><span>${esc(round)}</span><span>${num} / ${total}</span></div><div class="progress"><div class="fill" style="width:${100*num/total}%"></div></div><div class="eyebrow">${esc(q.tag)}</div><div class="question">${esc(q.q)}</div>${content}${fb}<hr class="divider"/><div class="actions"><button class="btn alt" onclick="previous()" ${st.review?st.reviewIndex===0?'disabled':'':i===0?'disabled':''}>← Back</button>${footer}</div><p class="small muted">${esc(st.name)} · ${st.review?'Practice mode (original score stays unchanged)':'Answers are checked immediately. Your progress is saved.'}</p></div>`);
if(q.type==='gap'&&!marked){$('#textAnswer').onkeydown=e=>{if(e.key==='Enter'&&hasResponse(i))check()}}
}
function roundBreak(){let a=Object.entries(st.results).filter(([k,v])=>Number(k)<50&&v.good).length;html(`<div class="card"><div class="eyebrow">Halfway there!</div><h1 class="title">Round 1 complete.</h1><div class="bigscore">${a}/50</div><p class="sub" style="text-align:center">Recognition & meaning</p><div class="notice">Your final certificate will combine both rounds. Keep going for collocations, grammar, and advanced contexts.</div><div class="actions"><button class="btn full" onclick="beginSecond()">Start Round 2 →</button></div></div>`)}
function nextOriginal(){if(st.idx===49)roundBreak();else next()}
const originalNext=next;next=function(){if(!st.review&&st.idx===49){roundBreak()}else originalNext()};
function report(){const r=st.report||makeReport();const misses=Q.map((q,i)=>({q,i})).filter(x=>!st.results[x.i]?.good);const bars=r.rounds.map((num,i)=>`<div class="barlabel"><span>Round ${i+1} · ${i?'Accuracy':'Recognition'}</span><strong>${num}/50 · ${num*2}%</strong></div><div class="roundbar"><div style="width:${num*2}%"></div></div>`).join('');html(`<div class="card"><div class="eyebrow" style="text-align:center">Homework completed</div><h1 class="title" style="text-align:center">Your results ✨</h1><div style="text-align:center"><span class="nameTag">${esc(r.name)} · ${esc(r.date)}</span></div><div class="bigscore">${r.percent}%</div><p class="small muted" style="text-align:center;margin-top:-12px">Vocabulary Lab · B1–B1+</p><div class="stats"><div class="stat"><strong>${r.good}</strong><span>Correct</span></div><div class="stat"><strong>${r.bad}</strong><span>Mistakes</span></div><div class="stat"><strong>${Math.floor(r.seconds/60)} min</strong><span>Time taken</span></div></div>${bars}<div class="notice" style="margin-top:24px">📸 Send your results to your teacher. You can take a screenshot or download a PNG certificate.</div><div class="actions"><button class="btn full" onclick="downloadPNG()">↓ Download results as PNG</button><button class="btn alt full" ${!misses.length?'disabled':''} onclick="reviewMistakes()">↻ Practise ${misses.length} mistakes</button></div><hr class="divider"/><details><summary style="cursor:pointer;font-weight:700">See your mistakes (${misses.length})</summary>${misses.map(x=>`<div class="reviewrow"><strong>${x.i+1}. ${esc(x.q.q)}</strong><p>Correct: ${esc(solution(x.q))}</p><p>${esc(x.q.exp)}</p></div>`).join('')||'<p>Perfect score!</p>'}</details><p class="small muted">Automatic checking is exact for typed answers (case and basic punctuation are ignored). A different valid answer may be marked wrong; ask your teacher if needed. Retakes do not replace your original score.</p><button class="btn outline" onclick="resetQuiz()">Start a new attempt</button></div>`)}
function reviewMistakes(){st.reviewList=Q.map((q,i)=>i).filter(i=>!st.results[i]?.good);if(!st.reviewList.length)return;st.review=true;st.reviewIndex=0;st.reviewDraft={};persist();render()}
function resetQuiz(){if(!confirm('Start a new attempt? Your current saved score will be cleared.'))return;st=fresh();persist();intro()}
function downloadPNG(){const r=st.report||makeReport(),w=1100,h=1400,c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');x.fillStyle='#faf8f6';x.fillRect(0,0,w,h);x.fillStyle='#fff';roundRect(x,62,60,976,1280,34);x.fill();x.textAlign='center';x.fillStyle='#7775b5';x.font='bold 28px Arial';x.fillText('VOCAB LAB · HOMEWORK',550,150);x.fillStyle='#29343b';x.font='bold 62px Arial';x.fillText('Vocabulary Challenge',550,245);x.font='30px Arial';x.fillText('B1–B1+ · Two rounds · 100 questions',550,300);x.font='bold 42px Arial';x.fillText(r.name.slice(0,30),550,390);x.font='bold 170px Arial';x.fillStyle='#297957';x.fillText(r.percent+'%',550,600);x.fillStyle='#728087';x.font='28px Arial';x.fillText('FINAL SCORE',550,655);let stats=[['Correct',r.good],['Mistakes',r.bad],['Time',formatTime(r.seconds)]];stats.forEach(([label,val],i)=>{let cx=220+330*i;x.fillStyle='#f4f3f8';roundRect(x,cx-130,715,260,150,20);x.fill();x.fillStyle='#29343b';x.font='bold 46px Arial';x.fillText(val,cx,780);x.font='26px Arial';x.fillStyle='#728087';x.fillText(label,cx,830)});r.rounds.forEach((v,i)=>{x.textAlign='left';x.font='bold 30px Arial';x.fillStyle='#29343b';x.fillText('Round '+(i+1),150,965+i*118);x.textAlign='right';x.fillText(v+'/50  ·  '+(v*2)+'%',950,965+i*118);x.fillStyle='#e8e8eb';roundRect(x,150,982+i*118,800,18,9);x.fill();x.fillStyle='#88a999';roundRect(x,150,982+i*118,800*v/50,18,9);x.fill()});x.textAlign='center';x.fillStyle='#7775b5';x.font='27px Arial';x.fillText('Completed '+r.date+'  ·  Send this result to your teacher',550,1240);let a=document.createElement('a');a.download='vocabulary-result-'+r.name.replace(/[^a-z0-9а-яё_-]/gi,'-')+'.png';a.href=c.toDataURL('image/png');a.click()}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
render();
</script></body></html>
